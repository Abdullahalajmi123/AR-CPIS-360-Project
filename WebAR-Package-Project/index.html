<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AR CPIS 360 Project</title>

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>

<body style="margin:0; overflow:hidden;">

<a-scene embedded vr-mode-ui="enabled: false" arjs="sourceType: webcam; debugUIEnabled: false;">

  <!-- HIRO MARKER = iPhone -->
  <a-marker preset="hiro">
    <a-gltf-model
      src="./models/iphone.glb"
      position="0 0.4 0"
      scale="25 25 25"      <!-- reasonable scale -->
      rotation="-90 0 180">  <!-- upright facing camera -->
    </a-gltf-model>

    <a-text
      value="iPhone Package\nStatus: Verified"
      position="0 1.8 0"
      rotation="-90 0 0"
      color="green"
      align="center"
      width="6">
    </a-text>
  </a-marker>

  <!-- KANJI MARKER = Headset -->
  <a-marker preset="kanji">
    <a-gltf-model
      src="./models/headphones.glb"
      position="0 0.4 0"
      scale="8 8 8"        <!-- slightly smaller than before -->
      rotation="-90 0 0">
    </a-gltf-model>

    <a-text
      value="Headset Package\nStatus: Verified"
      position="0 1.5 0"
      rotation="-90 0 0"
      color="blue"
      align="center"
      width="6">
    </a-text>
  </a-marker>

  <a-entity camera></a-entity>

</a-scene>

</body>
</html>
