<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AR CPIS 360 Project</title>

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>

<body style="margin:0; overflow:hidden;">

<a-scene embedded vr-mode-ui="enabled: false" arjs="sourceType: webcam; debugUIEnabled: false;">

  <!-- HIRO MARKER = iPhone -->
  <a-marker preset="hiro">

    <!-- iPhone placeholder cube scaled 500% -->
    <a-box
      position="0 0.5 0"
      depth="2.5"   <!-- 5× bigger -->
      height="10"
      width="5"
      color="blue">
    </a-box>

    <a-text
      value="iPhone Package\nStatus: Verified"
      position="0 6 0"
      rotation="-90 0 0"
      color="green"
      align="center"
      width="10">
    </a-text>

  </a-marker>

  <!-- KANJI MARKER = Headset -->
  <a-marker preset="kanji">

    <!-- Headset model 25% smaller -->
    <a-gltf-model
      src="./models/headphones.glb"
      position="0 0.5 0"
      scale="11.25 11.25 11.25"  <!-- 15 × 0.75 = 11.25 -->
      rotation="-90 0 0">
    </a-gltf-model>

    <a-text
      value="Headset Package\nStatus: Verified"
      position="0 2 0"
      rotation="-90 0 0"
      color="blue"
      align="center"
      width="6">
    </a-text>

  </a-marker>

  <a-entity camera></a-entity>

</a-scene>

</body>
</html>
