<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AR CPIS 360 Project</title>

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>

<body style="margin: 0; overflow: hidden;">

<a-scene embedded vr-mode-ui="enabled: false" renderer="logarithmicDepthBuffer: true;"
         arjs="sourceType: webcam; debugUIEnabled: false;">

  <!-- HIRO MARKER = iPhone (standing up, facing camera) -->
  <a-marker preset="hiro">

    <a-gltf-model
      src="./models/iphone.glb"
      position="0 0.3 0"
      scale="15 15 15"
      rotation="-90 0 0"  <!-- rotates model so front faces camera -->
      animation="property: rotation; to: -90 360 0; loop: true; dur: 8000">
    </a-gltf-model>

    <a-text
      value="iPhone Package\nStatus: Verified"
      position="0 1.5 0"
      rotation="-90 0 0"
      color="green"
      align="center"
      width="6">
    </a-text>

  </a-marker>

  <!-- KANJI MARKER = Headset (facing camera) -->
  <a-marker preset="kanji">

    <a-gltf-model
      src="./models/headphones.glb"
      position="0 0.3 0"
      scale="10 10 10"
      rotation="-90 0 0"  <!-- rotates headset to face front -->
      animation="property: rotation; to: -90 360 0; loop: true; dur: 8000">
    </a-gltf-model>

    <a-text
      value="Headset Package\nStatus: Verified"
      position="0 1.5 0"
      rotation="-90 0 0"
      color="blue"
      align="center"
      width="6">
    </a-text>

  </a-marker>

  <a-entity camera></a-entity>

</a-scene>

</body>
</html>
