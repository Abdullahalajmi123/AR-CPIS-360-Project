<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>CPIS-360 Project - Dynamic Packages</title>

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <script>
    // Register a custom A-Frame component to handle the API fetch
    AFRAME.registerComponent('package-manager', {
      init: function () {
        const sceneEl = this.el; // The <a-scene> element

        // Fetch the data from your JSON file
        fetch('packages.json')
          .then(response => response.json())
          .then(data => {
            
            // Loop through each package in the JSON
            data.forEach(pkg => {
              // 1. Create the Marker
              const marker = document.createElement('a-marker');
              
              if (pkg.markerType === 'preset') {
                marker.setAttribute('preset', pkg.markerValue);
              } else if (pkg.markerType === 'pattern') {
                // This handles custom generated markers
                marker.setAttribute('type', 'pattern');
                marker.setAttribute('url', pkg.markerValue); 
              }

              // 2. Create the 3D Model
              const model = document.createElement('a-gltf-model');
              model.setAttribute('src', pkg.modelSrc);
              model.setAttribute('position', '0 0.5 0');
              model.setAttribute('scale', pkg.scale);
              model.setAttribute('rotation', '-90 0 0');

              // 3. Create the Text
              const text = document.createElement('a-text');
              text.setAttribute('value', pkg.text);
              text.setAttribute('position', '0 2 0');
              text.setAttribute('rotation', '-90 0 0');
              text.setAttribute('color', pkg.textColor);
              text.setAttribute('align', 'center');
              text.setAttribute('width', '6');

              // 4. Attach the model and text to the marker, then attach the marker to the scene
              marker.appendChild(model);
              marker.appendChild(text);
              sceneEl.appendChild(marker);
            });
          })
          .catch(error => {
            console.error('Error loading package data:', error);
          });
      }
    });
  </script>
</head>

<body style="margin:0; overflow:hidden;">

<a-scene package-manager embedded vr-mode-ui="enabled: false" arjs="sourceType: webcam; debugUIEnabled: false;">
  
  <a-entity camera></a-entity>

</a-scene>

</body>
</html>
