<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>PackageReveal AR</title>

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>

<body style="margin: 0; overflow: hidden;">

<a-scene
  embedded
  vr-mode-ui="enabled: false"
  renderer="logarithmicDepthBuffer: true;"
  arjs="sourceType: webcam; debugUIEnabled: false;">

  <!-- IPHONE CUSTOM MARKER -->
  <a-marker type="pattern" url="./markers/iphone.patt">
    <a-gltf-model
      src="./models/iphone.glb"
      position="0 0.5 0"
      scale="0.05 0.05 0.05"
      rotation="0 0 0"
      animation="property: rotation; to: 0 360 0; loop: true; dur: 6000">
    </a-gltf-model>

    <a-text
      value="iPhone Package\nStatus: Verified\nProduct: iPhone 14 Pro"
      position="0 1.2 0"
      rotation="-90 0 0"
      color="green"
      align="center"
      width="4">
    </a-text>
  </a-marker>

  <!-- HEADSET CUSTOM MARKER -->
  <a-marker type="pattern" url="./markers/headphones.patt">
    <a-gltf-model
      src="./models/headphones.glb"
      position="0 0.5 0"
      scale="0.3 0.3 0.3"
      rotation="0 0 0"
      animation="property: rotation; to: 0 360 0; loop: true; dur: 6000">
    </a-gltf-model>

    <a-text
      value="Headset Package\nStatus: Verified\nProduct: Gaming Headset"
      position="0 1.2 0"
      rotation="-90 0 0"
      color="blue"
      align="center"
      width="4">
    </a-text>
  </a-marker>

  <a-entity camera></a-entity>

</a-scene>

</body>
</html>
