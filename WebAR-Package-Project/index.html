  <!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>PackageReveal AR</title>

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>

<body style="margin: 0; overflow: hidden;">

  <a-scene
    embedded
    arjs="sourceType: webcam; debugUIEnabled: false;">

    <!-- IPHONE MARKER -->
    <a-marker type="pattern" url="markers/iphone.patt">

      <a-gltf-model
        src="models/iphone.glb"
        position="0 0 0"
        scale="0.5 0.5 0.5"
        rotation="0 0 0"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 5000">
      </a-gltf-model>

      <a-text
        value="iPhone Package\nVerified Product"
        position="-1 1 0"
        rotation="-90 0 0"
        color="green"
        align="center"
        width="4">
      </a-text>

    </a-marker>


    <!-- SHOES MARKER -->
    <a-marker type="pattern" url="markers/shoes.patt">

      <a-gltf-model
        src="models/shoes.glb"
        position="0 0 0"
        scale="0.4 0.4 0.4"
        rotation="0 0 0"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 5000">
      </a-gltf-model>

      <a-text
        value="Shoes Package\nVerified Product"
        position="-1 1 0"
        rotation="-90 0 0"
        color="blue"
        align="center"
        width="4">
      </a-text>

    </a-marker>


    <!-- HEADPHONES MARKER -->
    <a-marker type="pattern" url="markers/headphones.patt">

      <a-gltf-model
        src="models/headphones.glb"
        position="0 0 0"
        scale="0.5 0.5 0.5"
        rotation="0 0 0"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 5000">
      </a-gltf-model>

      <a-text
        value="Headphones Package\nVerified Product"
        position="-1 1 0"
        rotation="-90 0 0"
        color="red"
        align="center"
        width="4">
      </a-text>

    </a-marker>

    <a-entity camera></a-entity>

  </a-scene>

</body>

</html>
